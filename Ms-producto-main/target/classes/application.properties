spring.application.name=ms-producto

#Evita choque de puertos con los otros microservicios
server.port=8084

#configuracion de logs
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
spring.output.ansi.enabled=ALWAYS

# Conexión a Supabase
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.rlsuzveutyfpasskdfix
spring.datasource.password=Ns!nqpWK$C8bR$x
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicialización
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Hibernate y JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=bd_usuarios

# Flyway (El motor de tus tablas)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=bd_usuarios

#SOLUCIÓN A ERRORES DE VALIDACIÓN Y CHECKSUM EN EQUIPO
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true