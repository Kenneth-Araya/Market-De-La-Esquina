server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-inventario-main
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/inventario/**
            - id: ms-productos
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/productos/**
            - id: ms-boleta
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/boletas/**
            - id: ms-usuario
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/usuarios/**
            - id: ms-venta
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/ventas/**
              filters:
                 - StripPrefix=2  
            