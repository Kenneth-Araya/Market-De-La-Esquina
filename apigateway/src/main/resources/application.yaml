server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-inventario-main
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/inventario/**
            - id: ms-productos
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/productos/**
            